<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Редактор расписания</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f1f3f5);--tx:var(--tg-theme-text-color,#17191c);--hint:var(--tg-theme-hint-color,#6b7280);--ac:var(--tg-theme-button-color,#2f6fed);--act:var(--tg-theme-button-text-color,#fff);--red:#d6403a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:90px}
button,input,textarea{font:inherit;color:inherit}
header{padding:16px 16px 8px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--hint);font-size:14px;margin:0}
.drop{margin:12px 16px;padding:28px 16px;border:2px dashed var(--hint);border-radius:14px;text-align:center;background:var(--bg2);cursor:pointer;display:block}
.drop b{display:block;margin-bottom:4px}.drop span{color:var(--hint);font-size:14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;padding:4px 16px 8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2}
.tools input[type=search]{flex:1 1 100%;min-width:0;border:0;background:var(--bg2);border-radius:10px;padding:9px 12px}
.sm{flex:1;min-height:40px;border:0;background:var(--bg2);border-radius:10px;padding:0 12px;cursor:pointer;white-space:nowrap}
.sm:disabled{opacity:.4}
.ev.cx .m strong{text-decoration:line-through}.ev.cx{opacity:.55}.ev.ex{opacity:.35}.x.c{color:var(--hint);font-size:20px}
.day{padding:14px 16px 6px;font-weight:600;font-size:14px;color:var(--hint);text-transform:capitalize}
.day.today{color:var(--ac)}
.ev{display:flex;gap:10px;padding:10px 12px 10px 13px;margin:0 8px;border-left:4px solid var(--hint);border-radius:6px;align-items:flex-start}
.ev+.ev{margin-top:2px}
.ev.bad{background:rgba(214,64,58,.1)}
.ev .t{width:52px;flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--hint)}
.ev .t b{display:block;color:var(--tx);font-size:15px}
.ev .m{flex:1;min-width:0;cursor:pointer}
.ev .m strong{display:block;word-break:break-word}
.ev .m small{display:block;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .w{color:var(--red);font-size:12px}
.x{border:0;background:none;color:var(--red);font-size:22px;line-height:1;min-width:44px;min-height:44px;margin:-8px 0;cursor:pointer}
.ev input[type=checkbox]{width:20px;height:20px;margin-top:3px;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bg2)}
.btn{flex:1;border:0;border-radius:12px;padding:13px 10px;background:var(--bg2);cursor:pointer;font-weight:600}
.btn.p{background:var(--ac);color:var(--act)}.btn.d{background:var(--red);color:#fff}
.btn:disabled{opacity:.4}
.empty{padding:32px 16px;text-align:center;color:var(--hint)}
dialog{border:0;border-radius:16px 16px 0 0;padding:0;margin:auto auto 0;width:100%;max-width:520px;background:var(--bg);color:var(--tx);max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(0,0,0,.45)}
form,.dd{padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
#f{padding-bottom:0}
label{display:grid;gap:4px;font-size:13px;color:var(--hint)}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],textarea{border:1px solid var(--bg2);background:var(--bg2);border-radius:10px;padding:8px 10px;width:100%;min-width:0;min-height:40px;font-size:16px;color:var(--tx)}
textarea{resize:vertical}
.f1{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px}
.fbar{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.fbar .btn{padding:12px 6px}.fbar .btn.p{flex:1.5}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dl{font-size:14px;margin:0;padding-left:18px;max-height:34vh;overflow:auto}
.dl li{margin:2px 0;word-break:break-word}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}.toast.act{pointer-events:auto;cursor:pointer}
.day.past{opacity:.55}.day,.wk{scroll-margin-top:96px}.wk{padding:14px 16px 0;font-size:12px;color:var(--hint);border-top:1px solid var(--bg2);margin-top:8px}.wk+.day{padding-top:2px}
.drop:focus-visible,.ev .m:focus-visible,#sub:focus-visible{outline:2px solid var(--ac);outline-offset:2px}#sub.lnk{cursor:pointer;text-decoration:underline dotted}
select{border:1px solid var(--bg2);background:var(--bg2);border-radius:10px;padding:8px 10px;width:100%;min-height:40px;font-size:16px;color:var(--tx)}
.tgm #save{display:none}
</style>
</head>
<body>
<header><h1>Редактор расписания</h1><p class="sub" id="sub"></p></header>
<label class="drop" id="drop" tabindex="0" role="button">
  <b>Выбрать файл .ics</b><span>или перетащите сюда</span>
  <input type="file" id="file" accept=".ics,text/calendar" hidden>
</label>
<div id="draft"></div>
<div class="tools" id="tools" style="display:none">
  <input type="search" id="q" placeholder="Поиск">
  <button class="sm" id="undo" disabled aria-label="Отменить действие">↶</button>
  <button class="sm" id="redo" disabled aria-label="Повторить действие">↷</button>
  <button class="sm" id="today">Сегодня</button>
  <button class="sm" id="subj">Предметы</button>
  <button class="sm" id="selmode">Выбрать</button>
  <button class="sm" id="closef" aria-label="Закрыть файл">Закрыть</button>
  <button class="sm" id="more">Ещё</button>
</div>
<main id="list"></main>
<div class="bar" id="bar1">
  <button class="btn" id="add" disabled>+ Запись</button>
  <button class="btn" id="share" disabled>Копировать .ics</button>
  <button class="btn p" id="save" disabled>Сохранить .ics</button>
</div>
<div class="bar" id="bar2" style="display:none">
  <button class="btn" id="selall">Все найденные</button>
  <button class="btn d" id="seldel" disabled>Удалить</button>
  <button class="btn" id="seldone">Готово</button>
</div>

<dialog id="dlg"><form id="f" method="dialog">
  <label class="f1">Название<input type="text" id="fs" required list="ls"></label>
  <div class="row">
    <label class="chk"><input type="checkbox" id="fa"> Весь день</label>
    <label class="chk"><input type="checkbox" id="fc"> Отменена</label>
  </div>
  <label class="chk"><input type="checkbox" id="fn"> Пересечение допустимо (подгруппы)</label>
  <label class="f1">Начало<input type="datetime-local" id="fb" required></label>
  <label class="f1">Конец<input type="datetime-local" id="fe"></label>
  <label class="f1">Место<input type="text" id="fl" list="ll"></label>
  <label class="f1">Заметка<textarea id="fd" rows="2"></textarea></label>
  <label class="f1" title="Создаст копии этой пары на следующие недели">Копии, нед.<input type="number" id="fr" min="0" max="40" value="0" inputmode="numeric"></label>
  <label class="f1">Повтор<select id="fi"><option value="1">каждую неделю</option><option value="2">через неделю</option></select></label>
  <div class="fbar">
    <button type="button" class="btn" id="fcopy">Копия</button>
    <button type="button" class="btn" id="cancel">Отмена</button>
    <button class="btn p" value="ok">Сохранить</button>
  </div>
  <datalist id="ls"></datalist><datalist id="ll"></datalist>
</form></dialog>

<dialog id="sd"><div class="dd"><b>Предметы в итоговом файле</b>
  <p class="sub">Снимите галочки с лишних: записи останутся в приложении, но в файл не попадут.</p>
  <div id="sl" style="display:grid;gap:10px;max-height:46vh;overflow:auto"></div>
  <div class="row"><button class="btn" id="sall">Все</button><button class="btn" id="snone">Ни одного</button></div>
  <button class="btn p" id="sdone">Готово</button></div></dialog>

<dialog id="bd"><div class="dd"><b id="bt"></b>
  <label>Новое название (пусто — не менять)<input type="text" id="bn"></label>
  <label>Место (пусто — не менять)<input type="text" id="bl" list="ll"></label>
  <label>Сдвиг времени, мин (±)<input type="number" id="bs" value="0" step="5" inputmode="numeric"></label>
  <label>Цвет предмета<input type="color" id="bk" value="#2f6fed" style="width:100%;height:40px;border:0;padding:0"></label>
  <div class="row"><button class="btn" id="bc">Отмена</button><button class="btn p" id="bok">Применить</button></div></div></dialog>

<dialog id="dd"><div class="dd">
  <b>Что изменилось</b><div id="ddb"></div>
  <div class="row"><button class="btn" id="ddc">Назад</button><button class="btn p" id="ddok">Сохранить файл</button></div>
</div></dialog>

<dialog id="txd"><form method="dialog">
  <label>Содержимое файла .ics<textarea id="txa" readonly style="min-height:240px;font:12px/1.3 monospace"></textarea></label>
  <div class="row"><button type="button" class="btn p" id="txc">Копировать</button><button class="btn" value="x">Закрыть</button></div>
</form></dialog>
<dialog id="md"><div class="dd"><b>Ещё</b>
  <label>Первая неделя семестра (любая дата этой недели)<input type="date" id="ms"></label>
  <label>Показывать тип пар<select id="mt"><option value="">все</option><option value="лек">лекции</option><option value="пр">практики</option><option value="лаб">лабораторные</option></select></label>
  <label>Напоминание за, мин<input type="number" id="ma" value="15" min="0" inputmode="numeric"></label>
  <div class="row"><button class="btn" id="mad">Добавить найденным</button><button class="btn" id="mar">Убрать у найденных</button></div>
  <label>Заменить в поле<select id="rf"><option value="location">Место</option><option value="summary">Название</option><option value="description">Заметка</option></select></label>
  <div class="row"><input type="text" id="rq" placeholder="Найти"><input type="text" id="rr" placeholder="Заменить на"></div>
  <button class="btn" id="rgo">Заменить везде</button>
  <label class="btn" style="display:block;text-align:center;cursor:pointer;color:var(--tx);font-size:16px">Обновить из нового .ics<input type="file" id="uf" accept=".ics,text/calendar" hidden></label>
  <button class="btn" id="mpr">Проблемы и статистика</button>
  <button class="btn p" id="mdn">Готово</button></div></dialog>

<dialog id="pd"><div class="dd"><b>Проблемы и статистика</b><div id="pb" style="max-height:60vh;overflow:auto"></div><button class="btn p" id="pdn">Готово</button></div></dialog>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} try { tg.disableVerticalSwipes(); } catch(e){} }
const newUid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random().toString(36).slice(2)) + '@ics-editor';
const tgDirty = on => { if (!tg) return; try { on ? tg.enableClosingConfirmation() : tg.disableClosingConfirmation(); } catch(e){} };
const hap = (t, k) => { try { tg.HapticFeedback[t](k); } catch(e){} };
const $ = id => document.getElementById(id);
const h = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let events = [], others = [], fileName = 'schedule.ics', fileLoaded = false;
let redoStack = [], badSet = new Set(), conflictOnly = false, bulkSubj = '', typeFilter = '', cfg = { start:'', colors:{} };
let nid = 0, editing = null, orig = {}, undoStack = [], sel = new Set(), selMode = false, scrolled = false, prevStart = '', excluded = new Set();

/* ---------- ICS parse ---------- */
const unesc = s => s.replace(/\\([nN,;\\])/g, (m, c) => /[nN]/.test(c) ? '\n' : c);
const esc = s => s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');

function splitLine(line){
  const i = line.indexOf(':');
  if (i < 0) return null;
  const left = line.slice(0,i), name = left.split(';')[0].toUpperCase();
  return { name, params: left.slice(name.length), value: line.slice(i+1) };
}

function parseICS(text){
  const lines = text.replace(/\r?\n[ \t]/g,'').split(/\r?\n/).filter(l => l.length);
  const evs = [], oth = [];
  let cur = null, depth = 0;
  for (const line of lines){
    const u = line.toUpperCase();
    if (!cur){
      if (u === 'BEGIN:VCALENDAR' || u === 'END:VCALENDAR') continue;
      if (u === 'BEGIN:VEVENT'){ cur = []; depth = 0; continue; }
      oth.push(line); continue;
    }
    if (u === 'END:VEVENT' && depth === 0){ evs.push(toEvent(cur)); cur = null; continue; }
    if (u.startsWith('BEGIN:')) depth++;
    if (u.startsWith('END:')) depth--;
    cur.push({ line, depth: u.startsWith('BEGIN:') ? depth-1 : u.startsWith('END:') ? depth+1 : depth });
  }
  return { evs, oth };
}

function toEvent(items){
  const e = { id:++nid, summary:'', location:'', description:'', start:null, end:null, uid:'', extra:[], cancelled:false };
  for (const it of items){
    if (it.depth > 0 || /^(BEGIN|END):/i.test(it.line)){ e.extra.push(it.line); continue; }
    const p = splitLine(it.line);
    if (!p){ e.extra.push(it.line); continue; }
    switch (p.name){
      case 'SUMMARY': e.summary = unesc(p.value); break;
      case 'LOCATION': e.location = unesc(p.value); break;
      case 'DESCRIPTION': e.description = unesc(p.value); break;
      case 'UID': e.uid = p.value; break;
      case 'DTSTART': e.start = { v:p.value, params:p.params }; break;
      case 'DTEND': e.end = { v:p.value, params:p.params }; break;
      case 'STATUS': if (/^CANCELLED/i.test(p.value)) e.cancelled = true; else e.extra.push(it.line); break;
      default: e.extra.push(it.line);
    }
  }
  if (e.summary.startsWith('[Отмена] ')){ e.summary = e.summary.slice(9); e.cancelled = true; }
  return e;
}

/* ---------- date helpers ---------- */
const anyTz = () => { const e = events.find(x => x.start && !isAllDay(x.start) && /TZID/i.test(x.start.params)); return e ? e.start.params : ''; };
const isAllDay = d => d && /^\d{8}$/.test(d.v);
const isZ = d => d && /Z$/.test(d.v);
const useZ = () => events.some(e => e.start && isZ(e.start));
function calTZ(){
  for (const l of others){
    const m = l.match(/^(?:X-WR-TIMEZONE|TIMEZONE-ID):(.+)$/i);
    if (m){ try { Intl.DateTimeFormat(undefined,{timeZone:m[1].trim()}); return m[1].trim(); } catch(e){} }
  }
  return Intl.DateTimeFormat().resolvedOptions().timeZone;
}
function wallOf(ms, tz){
  const p = {};
  new Intl.DateTimeFormat('en-CA',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})
    .formatToParts(new Date(ms)).forEach(x => p[x.type] = x.value);
  return `${p.year}${p.month}${p.day}T${p.hour}${p.minute}${p.second}`;
}
const digitsMs = w => Date.UTC(+w.slice(0,4), +w.slice(4,6)-1, +w.slice(6,8), +w.slice(9,11)||0, +w.slice(11,13)||0, +w.slice(13,15)||0);
function utcToWall(v, tz){ return wallOf(digitsMs(v.replace(/Z$/,'')), tz); }
function wallToUtc(w, tz){
  const want = digitsMs(w); let ms = want;
  for (let i = 0; i < 3; i++) ms -= digitsMs(wallOf(ms, tz)) - want;
  return wallOf(ms, 'UTC') + 'Z';
}
/* wall-clock digits (YYYYMMDD or YYYYMMDDTHHMMSS) in the calendar's time zone */
const wall = d => !d ? '' : (isAllDay(d) || !isZ(d)) ? d.v : utcToWall(d.v, calTZ());
const key = e => wall(e.start);
function toInput(d){
  if (!d) return '';
  const v = wall(d);
  const date = `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
  return isAllDay(d) ? date : `${date}T${v.slice(9,11)||'00'}:${v.slice(11,13)||'00'}`;
}
function fromInput(val, allDay, old){
  if (!val) return null;
  const digits = val.replace(/[-:]/g,'');
  if (allDay) return { v: digits.slice(0,8), params: ';VALUE=DATE' };
  const keep = old && !isAllDay(old);
  const tz = keep ? (/TZID/i.test(old.params) ? old.params : '') : anyTz();
  const z = keep ? isZ(old) : (useZ());
  const w = digits + '00';
  return z ? { v: wallToUtc(w, calTZ()), params: '' } : { v: w, params: tz };
}
const fmtDay = k => new Date(+k.slice(0,4), +k.slice(4,6)-1, +k.slice(6,8))
  .toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const wkOf = k => { const d = new Date(+k.slice(0,4), +k.slice(4,6)-1, +k.slice(6,8)); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };
const isoWeek = k => { const d = new Date(Date.UTC(+k.slice(0,4), +k.slice(4,6)-1, +k.slice(6,8))); d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7)); return Math.ceil(((d - Date.UTC(d.getUTCFullYear(),0,1)) / 864e5 + 1) / 7); };
const hm = d => { const v = wall(d); return d && !isAllDay(d) && v.length >= 13 ? `${v.slice(9,11)}:${v.slice(11,13)}` : ''; };

/* ---------- state, undo, draft ---------- */
const okey = e => e.uid || 'n' + e.id;
const alarmLines = (x, keep) => { let d = 0; return x.filter(l => { if (/^BEGIN:VALARM/i.test(l)) d = 1; const a = d; if (/^END:VALARM/i.test(l)) d = 0; return keep ? a : !a; }); };
const alarmSig = e => alarmLines(e.extra, true).filter(l => /^TRIGGER/i.test(l)).join('|');
const sig = e => JSON.stringify([e.summary, e.location, e.description, e.start, e.end, e.cancelled].concat(alarmSig(e) ? [alarmSig(e)] : []));
const typeOf = e => { const t = (e.summary + ' ' + e.description).toLowerCase(); return /лаб/.test(t) ? 'лаб' : /практ|семинар|(^|[^а-яё])(пр|пз)([^а-яё]|$)/.test(t) ? 'пр' : /лекц|(^|[^а-яё])лек([^а-яё]|$)/.test(t) ? 'лек' : ''; };
const wkNum = dk => cfg.start ? Math.round((wkOf(dk) - wkOf(cfg.start.replace(/-/g,''))) / 6048e5) + 1 : 0;
const wkName = dk => { const n = wkNum(dk); return n >= 1 ? `нед. ${n} · ${n % 2 ? 'нечётная' : 'чётная'}` : `нед. ${isoWeek(dk)} (ISO)`; };
const byId = id => events.find(e => e.id === id);
function snapOrig(){ orig = {}; events.forEach(e => orig[okey(e)] = { s: sig(e), name: lbl(e) }); }
function saveDraft(){
  try { localStorage.setItem('ics-draft', JSON.stringify({ fileName, others, events, orig, excluded: [...excluded], cfg })); } catch(e){}
}
function loadDraft(){ try { return JSON.parse(localStorage.getItem('ics-draft')); } catch(e){ return null; } }
const snap = () => JSON.stringify({ e: events, x: [...excluded] });
const restore = t => { const o = JSON.parse(t); events = o.e; excluded = new Set(o.x); sel.clear(); saveDraft(); render(); };
function mutate(fn){
  undoStack.push(snap()); if (undoStack.length > 30) undoStack.shift(); redoStack = [];
  fn(); tgDirty(true); hap('impactOccurred', 'light'); saveDraft(); render();
}
function undo(){ if (!undoStack.length) return; redoStack.push(snap()); restore(undoStack.pop()); toast('Действие отменено'); }
function redo(){ if (!redoStack.length) return; undoStack.push(snap()); restore(redoStack.pop()); toast('Действие повторено'); }
$('undo').onclick = undo; $('redo').onclick = redo;
document.addEventListener('keydown', e => {
  if (!(e.ctrlKey || e.metaKey) || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  const k = e.key.toLowerCase();
  if (k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); } else if (k === 'y'){ e.preventDefault(); redo(); }
});

/* ---------- derived ---------- */
const lbl = e => { const w = wall(e.start); return `${w.slice(6,8)}.${w.slice(4,6)} ${hm(e.start)} ${e.summary}`.replace(/  +/g,' '); };
const hue = s => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) % 360; return x; };
const span = e => {
  if (!e.start || isAllDay(e.start)) return null;
  const a = digitsMs(wall(e.start)); return [a, e.end && !isAllDay(e.end) ? digitsMs(wall(e.end)) : a];
};
function overlaps(){

/* ---------- export ---------- */
function fold(line){
  const enc = new TextEncoder(), out = []; let cur = '', n = 0;
  for (const ch of line){
    const b = enc.encode(ch).length;
    if (n + b > 75){ out.push(cur); cur = ' '; n = 1; }
    cur += ch; n += b;
  }
  out.push(cur); return out;
}
function buildICS(){
  const L = ['BEGIN:VCALENDAR'];
  const has = n => others.some(l => l.toUpperCase().startsWith(n));
  if (!has('VERSION')) L.push('VERSION:2.0');
  if (!has('PRODID')) L.push('PRODID:-//Telegram ICS Editor//RU');
  L.push(...others);
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  for (const e of exported()){
    const o = orig[okey(e)], changed = !!o && o.s !== sig(e);
    let ex = e.extra, seq = 0;
    if (e.cancelled) ex = ex.filter(l => !/^STATUS/i.test(l));
    if (e.end) ex = ex.filter(l => !/^DURATION/i.test(l));
    if (changed){
      const m = ex.map(l => l.match(/^SEQUENCE:(\d+)/i)).find(Boolean);
      seq = (m ? +m[1] : 0) + 1;
      ex = ex.filter(l => !/^(SEQUENCE|LAST-MODIFIED)[:;]/i.test(l));
    }
    L.push('BEGIN:VEVENT');
    L.push('UID:' + (e.uid || newUid()));
    if (!ex.some(l => /^DTSTAMP/i.test(l))) L.push('DTSTAMP:' + stamp);
    if (e.start) L.push(`DTSTART${e.start.params}:${e.start.v}`);
    if (e.end) L.push(`DTEND${e.end.params}:${e.end.v}`);
    L.push('SUMMARY:' + esc((e.cancelled ? '[Отмена] ' : '') + e.summary));
    if (e.location) L.push('LOCATION:' + esc(e.location));
    if (e.description) L.push('DESCRIPTION:' + esc(e.description));
    L.push(...ex);
    if (changed) L.push('SEQUENCE:' + seq, 'LAST-MODIFIED:' + stamp);
    if (e.cancelled) L.push('STATUS:CANCELLED');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.flatMap(fold).join('\r\n') + '\r\n';
}

$('mar').onclick = () => setAlarm(false);
$('rgo').onclick = () => {
  const f = $('rf').value, q = $('rq').value, r = $('rr').value; if (!q) return;
  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'); let n = 0;
  mutate(() => events.forEach(e => { if (e[f].toLowerCase().includes(q.toLowerCase())){ e[f] = e[f].replace(re, () => r); n++; } }));
  toast(`Изменено записей: ${n} · Отменить`, true);
};

/* ---------- обновление из нового файла с переносом правок ---------- */
const mkey = (t, d) => t + '|' + wall(d);
function mergeFile(text){
  const { evs, oth } = parseICS(text);
  if (!evs.length){ toast('В файле нет записей'); return; }
  const byUid = new Map(), byKey = new Map(), used = new Set();
  evs.forEach(n => { if (n.uid) byUid.set(n.uid, n); const k = mkey(n.summary, n.start); byKey.set(k, (byKey.get(k) || []).concat(n)); });
  const cur = new Map(events.map(e => [okey(e), e])), out = [], no = {}, st = { carried:0, kept:0, gone:0, add:0, del:0 };
  const push = (m, n) => { out.push(m); no[okey(m)] = { s: sig(n), name: lbl(n) }; };
  for (const [k, o] of Object.entries(orig)){
    const b = JSON.parse(o.s), c = cur.get(k);
    let n = byUid.get(k); if (n && used.has(n)) n = null;
    if (!n) n = (byKey.get(mkey(b[0], b[3])) || []).find(x => !used.has(x));
    if (n) used.add(n);
    if (!c){ if (n) st.del++; continue; }
    if (!n){ if (sig(c) !== o.s){ out.push(c); st.kept++; } else st.gone++; continue; }
    const m = Object.assign({}, n, { id: c.id, uid: n.uid || c.uid, noconf: c.noconf });
    ['summary','location','description','start','end','cancelled'].forEach((f, i) => { if (JSON.stringify(c[f]) !== JSON.stringify(b[i])){ m[f] = c[f]; st.carried++; } });
    if (alarmSig(c) !== (b[6] || '')) m.extra = alarmLines(n.extra, false).concat(alarmLines(c.extra, true));
    push(m, n);
  }
  events.filter(e => !orig[okey(e)]).forEach(e => out.push(e));
  evs.filter(n => !used.has(n)).forEach(n => { if (!n.uid) n.uid = newUid(); push(n, n); st.add++; });
  if (!confirm(`Новых пар: ${st.add}\nУбрано из расписания: ${st.gone}\nВаших правок перенесено: ${st.carried + st.kept}\nВаших удалений сохранено: ${st.del}\n\nПрименить?`)) return;
  events = out; others = oth; orig = no; undoStack = []; redoStack = []; sel.clear(); conflictOnly = false;
  nid = Math.max(nid, ...events.map(e => e.id)); saveDraft(); render(); toast('Расписание обновлено');
}
$('uf').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => { $('md').close(); mergeFile(String(r.result)); $('uf').value = ''; }; r.readAsText(f);
};

/* ---------- проблемы и статистика ---------- */
function probHTML(){
  const T = events.filter(e => !e.cancelled && !excluded.has(e.summary) && span(e)), P = {}, seen = new Set(), byDay = {};
  const add = (t, e, x) => (P[t] = P[t] || []).push([e.id, lbl(e) + (x || '')]);
  T.forEach(e => {
    const [a, b] = span(e), w = wall(e.start), hh = +w.slice(9,11), dk = w.slice(0,8), k = e.summary + '|' + w + '|' + (e.end ? wall(e.end) : '');
    if (!e.location) add('Без места', e);
    if (b <= a) add('Нулевая длительность', e);
    if (hh < 7 || hh >= 22) add('Ночью (до 7 / после 22)', e);
    if (new Date(a).getUTCDay() === 0) add('В воскресенье', e);
    if (seen.has(k)) add('Дубли', e); else seen.add(k);
    (byDay[dk] = byDay[dk] || []).push(e);
  });
  Object.values(byDay).forEach(d => {
    d.sort((x, y) => span(x)[0] - span(y)[0]); let end = span(d[0])[1];
    for (let i = 1; i < d.length; i++){
      const [a, b] = span(d[i]);
      if (a - end > 18e6) add('Окна больше 3 ч', d[i], ` (окно ${Math.round((a - end) / 36e5 * 10) / 10} ч)`);
      end = Math.max(end, b);
    }
  });
  const sj = new Map(), wk = new Map();
  T.forEach(e => {
    const [a, b] = span(e), hrs = (b - a) / 36e6 * 10, dk = wall(e.start).slice(0,8), t = wkOf(dk).getTime();
    sj.set(e.summary, (sj.get(e.summary) || 0) + hrs / 10);
    const w = wk.get(t) || [wkName(dk), 0]; w[1] += hrs / 10; wk.set(t, w);
  });
  const bars = rows => { const mx = Math.max(...rows.map(r => r[1]), 1); return rows.map(r => `<div style="font-size:13px;margin:4px 0"><div style="display:flex;justify-content:space-between;gap:8px"><span>${h(r[0])}</span><span>${Math.round(r[1] * 10) / 10} ч</span></div><div style="height:5px;border-radius:3px;background:var(--ac);width:${r[1] / mx * 100}%"></div></div>`).join(''); };
  const sec = Object.entries(P).map(([t, a]) => `<p style="margin:8px 0 2px;color:var(--red)"><b>${t}: ${a.length}</b></p><ul class="dl">${a.map(x => `<li data-o="${x[0]}" style="cursor:pointer">${h(x[1])}</li>`).join('')}</ul>`).join('') || '<p class="sub">Проблем не найдено</p>';
  return sec + '<p style="margin:14px 0 2px"><b>Часы по предметам</b></p>' + bars([...sj].map(([n, v]) => [n || 'Без названия', v]).sort((x, y) => y[1] - x[1]))
    + '<p style="margin:14px 0 2px"><b>Нагрузка по неделям</b></p>' + bars([...wk].sort((x, y) => x[0] - y[0]).map(x => x[1]));
}
$('mpr').onclick = () => { $('md').close(); $('pb').innerHTML = probHTML(); $('pd').showModal(); };
$('pb').onclick = e => { const li = e.target.closest('[data-o]'); if (li){ $('pd').close(); openEditor(+li.dataset.o); } };
$('pdn').onclick = () => $('pd').close();

/* ---------- Telegram: MainButton / BackButton ---------- */
function syncTg(){
  if (!tg || !tg.initData) return;
  document.body.classList.add('tgm');
  const open = [...document.querySelectorAll('dialog')].some(d => d.open);
  try {
    if (fileLoaded && !selMode && !open){ tg.MainButton.setText('Сохранить .ics'); tg.MainButton.show(); } else tg.MainButton.hide();
    open ? tg.BackButton.show() : tg.BackButton.hide();
  } catch(e){}
}
if (tg && tg.initData) try {
  tg.MainButton.onClick(() => $('save').click());
  tg.BackButton.onClick(() => { const d = [...document.querySelectorAll('dialog')].filter(x => x.open).pop(); if (d) d.close(); });
} catch(e){}
const _sm = HTMLDialogElement.prototype.showModal;
HTMLDialogElement.prototype.showModal = function(){ _sm.call(this); syncTg(); };
document.querySelectorAll('dialog').forEach(d => d.addEventListener('close', syncTg));
render();
