<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Редактор расписания</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--bg2:var(--tg-theme-secondary-bg-color,#f1f3f5);--tx:var(--tg-theme-text-color,#17191c);--hint:var(--tg-theme-hint-color,#6b7280);--ac:var(--tg-theme-button-color,#2f6fed);--act:var(--tg-theme-button-text-color,#fff);--red:#d6403a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:90px}
button,input,textarea{font:inherit;color:inherit}
header{padding:16px 16px 8px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--hint);font-size:14px;margin:0}
.drop{margin:12px 16px;padding:28px 16px;border:2px dashed var(--hint);border-radius:14px;text-align:center;background:var(--bg2);cursor:pointer;display:block}
.drop b{display:block;margin-bottom:4px}.drop span{color:var(--hint);font-size:14px}
.sticky{position:sticky;top:0;background:var(--bg);z-index:2;padding-top:4px}.tools{display:flex;gap:8px;padding:4px 16px 8px}
.tools input[type=search]{flex:1;min-width:0;border:0;background:var(--bg2);border-radius:10px;padding:9px 12px}
.sm{border:0;background:var(--bg2);border-radius:10px;padding:0 12px;cursor:pointer;white-space:nowrap}
.sm:disabled{opacity:.4}
.ev.cx .m strong{text-decoration:line-through}.ev.cx{opacity:.55}.ev.ex{opacity:.35}.x.c{color:var(--hint);font-size:20px}
.day{padding:14px 16px 6px;font-weight:600;font-size:14px;color:var(--hint);text-transform:capitalize}
.day.today{color:var(--ac)}
.ev{display:flex;gap:10px;padding:10px 12px 10px 13px;margin:0 8px;border-left:4px solid var(--hint);border-radius:6px;align-items:flex-start}
.ev+.ev{margin-top:2px}
.ev.bad{background:rgba(214,64,58,.1)}
.ev .t{width:52px;flex:none;font-variant-numeric:tabular-nums;font-size:13px;color:var(--hint)}
.ev .t b{display:block;color:var(--tx);font-size:15px}
.ev .m{flex:1;min-width:0;cursor:pointer}
.ev .m strong{display:block;word-break:break-word}
.ev .m small{display:block;color:var(--hint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .w{color:var(--red);font-size:12px}
.x{border:0;background:none;color:var(--red);font-size:22px;line-height:1;padding:4px 8px;cursor:pointer}
.ev input[type=checkbox]{width:20px;height:20px;margin-top:3px;flex:none}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bg2)}
.btn{flex:1;border:0;border-radius:12px;padding:13px 10px;background:var(--bg2);cursor:pointer;font-weight:600}
.btn.p{background:var(--ac);color:var(--act)}.btn.d{background:var(--red);color:#fff}
.btn:disabled{opacity:.4}
.empty{padding:32px 16px;text-align:center;color:var(--hint)}
dialog{border:0;border-radius:16px 16px 0 0;padding:0;margin:auto auto 0;width:100%;max-width:520px;background:var(--bg);color:var(--tx);max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px);overflow:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(0,0,0,.45)}
form,.dd{padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
#f{padding-bottom:0}
label{display:grid;gap:4px;font-size:13px;color:var(--hint)}
input[type=text],input[type=number],input[type=date],input[type=datetime-local],textarea{border:1px solid var(--bg2);background:var(--bg2);border-radius:10px;padding:8px 10px;width:100%;min-width:0;min-height:40px;font-size:16px;color:var(--tx)}
textarea{resize:vertical}
.f1{display:grid;grid-template-columns:72px 1fr;align-items:center;gap:8px}
.fbar{display:flex;gap:8px;position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.fbar .btn{padding:12px 6px}.fbar .btn.p{flex:1.5}
.chk{display:flex;gap:8px;align-items:center;color:var(--tx);font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dl{font-size:14px;margin:0;padding-left:18px;max-height:34vh;overflow:auto}
.dl li{margin:2px 0;word-break:break-word}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}.toast.act{pointer-events:auto;cursor:pointer}
.ev{display:flex;gap:10px;margin:6px 12px;padding:12px 10px 12px 16px;border-left:0;border-radius:14px;background:var(--bg2);box-shadow:inset 4px 0 0 var(--c,var(--hint));align-items:center;touch-action:pan-y;transition:transform .15s,background .15s}
.ev+.ev{margin-top:6px}
.ev.bad{background:rgba(214,64,58,.14)}
.ev[data-sw=del]{background:rgba(214,64,58,.32)}.ev[data-sw=cx]{background:rgba(130,130,130,.35)}
.meta{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:4px}
.pill{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 9px;border-radius:999px;background:var(--bg);color:var(--tx)}
.meta small{white-space:normal}
.day{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 4px;text-transform:none;cursor:pointer;font-size:15px}
.day span:first-child::first-letter{text-transform:uppercase}
.day.today{color:var(--ac)}.cnt{font-weight:400;font-size:13px}
.day{scroll-margin-top:112px}
.strip{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;scrollbar-width:none}.strip::-webkit-scrollbar,.slots::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:12px;background:var(--bg2);padding:5px 10px;min-width:44px;text-align:center;cursor:pointer;line-height:1.15}
.chip span{display:block;font-size:11px;color:var(--hint);text-transform:uppercase}.chip b{font-size:16px}
.chip.t{background:var(--ac);color:var(--act)}.chip.t span{color:var(--act)}
.slots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.slots .chip{padding:7px 11px;font-size:13px;white-space:nowrap}
.past{display:block;margin:10px auto;border:0;background:none;color:var(--ac);font-size:14px;cursor:pointer}
.x{display:none}@media (hover:hover){.x{display:block}}
.empty .ic{font-size:44px;margin-bottom:6px}
.toast{max-width:90vw;text-align:center}
dialog[open]{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body>
<header><h1>Редактор расписания</h1><p class="sub" id="sub"></p></header>
<label class="drop" id="drop">
  <b>Выбрать файл .ics</b><span>или перетащите сюда</span>
  <input type="file" id="file" accept=".ics,text/calendar" hidden>
</label>
<div id="draft"></div>
<div class="sticky" id="sticky" style="display:none"><div class="tools" id="tools">
  <input type="search" id="q" placeholder="Поиск">
  <button class="sm" id="undo" disabled aria-label="Отменить действие">↶</button>
  <button class="sm" id="subj">Предметы</button>
  <button class="sm" id="selmode">Выбрать</button>
</div>
<div class="strip" id="strip"></div></div>
<main id="list"></main>
<div class="bar" id="bar1">
  <button class="btn" id="add" disabled>+ Запись</button>
  <button class="btn" id="share" disabled>Текст</button>
  <button class="btn p" id="save" disabled>Сохранить</button>
</div>
<div class="bar" id="bar2" style="display:none">
  <button class="btn" id="selall">Все найденные</button>
  <button class="btn d" id="seldel" disabled>Удалить</button>
  <button class="btn" id="seldone">Готово</button>
</div>

<dialog id="dlg"><form id="f" method="dialog">
  <label class="f1">Название<input type="text" id="fs" required list="ls"></label>
  <div class="row">
    <label class="chk"><input type="checkbox" id="fa"> Весь день</label>
    <label class="chk"><input type="checkbox" id="fc"> Отменена</label>
  </div>
  <div class="slots" id="slots"></div>
  <label class="f1">Начало<input type="datetime-local" id="fb" required></label>
  <label class="f1">Конец<input type="datetime-local" id="fe"></label>
  <label class="f1">Место<input type="text" id="fl" list="ll"></label>
  <label class="f1">Заметка<textarea id="fd" rows="2"></textarea></label>
  <label class="f1" title="Создаст копии этой пары на следующие недели">Копии, нед.<input type="number" id="fr" min="0" max="40" value="0" inputmode="numeric"></label>
  <div class="fbar">
    <button type="button" class="btn" id="fcopy">Копия</button>
    <button type="button" class="btn" id="cancel">Отмена</button>
    <button class="btn p" value="ok">Сохранить</button>
  </div>
  <datalist id="ls"></datalist><datalist id="ll"></datalist>
</form></dialog>

<dialog id="sd"><div class="dd"><b>Предметы в итоговом файле</b>
  <p class="sub">Снимите галочки с лишних: записи останутся в приложении, но в файл не попадут.</p>
  <div id="sl" style="display:grid;gap:10px;max-height:46vh;overflow:auto"></div>
  <div class="row"><button class="btn" id="sall">Все</button><button class="btn" id="snone">Ни одного</button></div>
  <button class="btn p" id="sdone">Готово</button></div></dialog>

<dialog id="dd"><div class="dd">
  <b>Что изменилось</b><div id="ddb"></div>
  <div class="row"><button class="btn" id="ddc">Назад</button><button class="btn p" id="ddok">Сохранить файл</button></div>
</div></dialog>

<dialog id="txd"><form method="dialog">
  <label>Содержимое файла .ics<textarea id="txa" readonly style="min-height:240px;font:12px/1.3 monospace"></textarea></label>
  <div class="row"><button type="button" class="btn p" id="txc">Копировать</button><button class="btn" value="x">Закрыть</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); } catch(e){} }
const $ = id => document.getElementById(id);
const h = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let events = [], others = [], fileName = 'schedule.ics', fileLoaded = false;
let nid = 0, editing = null, orig = {}, undoStack = [], sel = new Set(), selMode = false, scrolled = false, prevStart = '', excluded = new Set();

/* ---------- ICS parse ---------- */
const unesc = s => s.replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1');
const esc = s => s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');

function splitLine(line){
  const i = line.indexOf(':');
  if (i < 0) return null;
  const left = line.slice(0,i), name = left.split(';')[0].toUpperCase();
  return { name, params: left.slice(name.length), value: line.slice(i+1) };
}

function parseICS(text){
  const lines = text.replace(/\r?\n[ \t]/g,'').split(/\r?\n/).filter(l => l.length);
  const evs = [], oth = [];
  let cur = null, depth = 0;
  for (const line of lines){
    const u = line.toUpperCase();
    if (!cur){
      if (u === 'BEGIN:VCALENDAR' || u === 'END:VCALENDAR') continue;
      if (u === 'BEGIN:VEVENT'){ cur = []; depth = 0; continue; }
      oth.push(line); continue;
    }
    if (u === 'END:VEVENT' && depth === 0){ evs.push(toEvent(cur)); cur = null; continue; }
    if (u.startsWith('BEGIN:')) depth++;
    if (u.startsWith('END:')) depth--;
    cur.push({ line, depth: u.startsWith('BEGIN:') ? depth-1 : u.startsWith('END:') ? depth+1 : depth });
  }
  return { evs, oth };
}

function toEvent(items){
  const e = { id:++nid, summary:'', location:'', description:'', start:null, end:null, uid:'', extra:[], cancelled:false };
  for (const it of items){
    if (it.depth > 0 || /^(BEGIN|END):/i.test(it.line)){ e.extra.push(it.line); continue; }
    const p = splitLine(it.line);
    if (!p){ e.extra.push(it.line); continue; }
    switch (p.name){
      case 'SUMMARY': e.summary = unesc(p.value); break;
      case 'LOCATION': e.location = unesc(p.value); break;
      case 'DESCRIPTION': e.description = unesc(p.value); break;
      case 'UID': e.uid = p.value; break;
      case 'DTSTART': e.start = { v:p.value, params:p.params }; break;
      case 'DTEND': e.end = { v:p.value, params:p.params }; break;
      case 'STATUS': if (/^CANCELLED/i.test(p.value)) e.cancelled = true; else e.extra.push(it.line); break;
      default: e.extra.push(it.line);
    }
  }
  if (e.summary.startsWith('[Отмена] ')){ e.summary = e.summary.slice(9); e.cancelled = true; }
  return e;
}

/* ---------- date helpers ---------- */
const isAllDay = d => d && /^\d{8}$/.test(d.v);
const isZ = d => d && /Z$/.test(d.v);
const useZ = () => events.some(e => e.start && isZ(e.start));
function calTZ(){
  for (const l of others){
    const m = l.match(/^(?:X-WR-TIMEZONE|TIMEZONE-ID):(.+)$/i);
    if (m){ try { Intl.DateTimeFormat(undefined,{timeZone:m[1].trim()}); return m[1].trim(); } catch(e){} }
  }
  return Intl.DateTimeFormat().resolvedOptions().timeZone;
}
function wallOf(ms, tz){
  const p = {};
  new Intl.DateTimeFormat('en-CA',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})
    .formatToParts(new Date(ms)).forEach(x => p[x.type] = x.value);
  return `${p.year}${p.month}${p.day}T${p.hour}${p.minute}${p.second}`;
}
const digitsMs = w => Date.UTC(+w.slice(0,4), +w.slice(4,6)-1, +w.slice(6,8), +w.slice(9,11)||0, +w.slice(11,13)||0, +w.slice(13,15)||0);
function utcToWall(v, tz){ return wallOf(digitsMs(v.replace(/Z$/,'')), tz); }
function wallToUtc(w, tz){
  const want = digitsMs(w); let ms = want;
  for (let i = 0; i < 3; i++) ms -= digitsMs(wallOf(ms, tz)) - want;
  return wallOf(ms, 'UTC') + 'Z';
}
/* wall-clock digits (YYYYMMDD or YYYYMMDDTHHMMSS) in the calendar's time zone */
const wall = d => !d ? '' : (isAllDay(d) || !isZ(d)) ? d.v : utcToWall(d.v, calTZ());
const key = e => wall(e.start);
function toInput(d){
  if (!d) return '';
  const v = wall(d);
  const date = `${v.slice(0,4)}-${v.slice(4,6)}-${v.slice(6,8)}`;
  return isAllDay(d) ? date : `${date}T${v.slice(9,11)||'00'}:${v.slice(11,13)||'00'}`;
}
function fromInput(val, allDay, old){
  if (!val) return null;
  const digits = val.replace(/[-:]/g,'');
  if (allDay) return { v: digits.slice(0,8), params: ';VALUE=DATE' };
  const keep = old && !isAllDay(old);
  const tz = keep && /TZID/i.test(old.params) ? old.params : '';
  const z = keep ? isZ(old) : (useZ());
  const w = digits + '00';
  return z ? { v: wallToUtc(w, calTZ()), params: '' } : { v: w, params: tz };
}
const fmtDay = k => new Date(+k.slice(0,4), +k.slice(4,6)-1, +k.slice(6,8))
  .toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const hm = d => { const v = wall(d); return d && !isAllDay(d) && v.length >= 13 ? `${v.slice(9,11)}:${v.slice(11,13)}` : ''; };

/* ---------- state, undo, draft ---------- */
const okey = e => e.uid || 'n' + e.id;
const sig = e => JSON.stringify([e.summary, e.location, e.description, e.start, e.end, e.cancelled]);
const byId = id => events.find(e => e.id === id);
function snapOrig(){ orig = {}; events.forEach(e => orig[okey(e)] = { s: sig(e), name: lbl(e) }); }
function saveDraft(){
  try { localStorage.setItem('ics-draft', JSON.stringify({ fileName, others, events, orig, excluded: [...excluded] })); } catch(e){}
}
function loadDraft(){ try { return JSON.parse(localStorage.getItem('ics-draft')); } catch(e){ return null; } }
function mutate(fn){
  undoStack.push(JSON.stringify(events)); if (undoStack.length > 30) undoStack.shift();
  fn(); saveDraft(); render(); buzz();
  try { tg.enableClosingConfirmation(); } catch(e){}
}
function undo(){
  if (!undoStack.length) return;
  events = JSON.parse(undoStack.pop()); sel.clear(); saveDraft(); render(); toast('Действие отменено');
}
$('undo').onclick = undo;

/* ---------- derived ---------- */
const lbl = e => { const w = wall(e.start); return `${w.slice(6,8)}.${w.slice(4,6)} ${hm(e.start)} ${e.summary}`.replace(/  +/g,' '); };
const hue = s => { let x = 0; for (const c of s) x = (x * 31 + c.charCodeAt(0)) % 360; return x; };
const span = e => {
  if (!e.start || isAllDay(e.start)) return null;
  const a = digitsMs(wall(e.start)); return [a, e.end && !isAllDay(e.end) ? digitsMs(wall(e.end)) : a];
};
function overlaps(){
  const bad = new Set(), L = events.filter(e => !e.cancelled && !excluded.has(e.summary)).map(e => [e, span(e)]).filter(x => x[1]);
  for (let i = 0; i < L.length; i++) for (let j = i + 1; j < L.length; j++){
    const a = L[i][1], b = L[j][1];
    if (a[0] < b[1] && b[0] < a[1]){ bad.add(L[i][0].id); bad.add(L[j][0].id); }
  }
  return bad;
}
function visible(){
  const q = $('q').value.trim().toLowerCase();
  return events.filter(e => !q || (e.summary + ' ' + e.location + ' ' + e.description).toLowerCase().includes(q));
}

/* ---------- render ---------- */
const collapsed = new Set(); let showPast = false;
const wd = dk => new Date(+dk.slice(0,4), +dk.slice(4,6)-1, +dk.slice(6,8)).toLocaleDateString('ru', { weekday:'short' });
function render(){
  const bad = overlaps(), n = events.length;
  ['add','save','share'].forEach(id => $(id).disabled = !fileLoaded);
  $('undo').disabled = !undoStack.length;
  $('sticky').style.display = fileLoaded ? 'block' : 'none';
  $('drop').style.display = fileLoaded ? 'none' : 'block';
  $('bar1').style.display = selMode ? 'none' : 'flex';
  $('bar2').style.display = selMode ? 'flex' : 'none';
  $('seldel').textContent = sel.size ? `Удалить (${sel.size})` : 'Удалить';
  $('seldel').disabled = !sel.size;
  $('selmode').textContent = selMode ? 'Отмена' : 'Выбрать';
  $('subj').textContent = excluded.size ? 'Предметы •' : 'Предметы';
  $('sub').textContent = fileLoaded ? `${fileName} · записей: ${n}` + (excluded.size ? ` · в файл: ${exported().length}` : '') + (bad.size ? ` · с пересечениями: ${bad.size}` : '') : 'Загрузите файл .ics, чтобы увидеть записи';
  if (useMain){ fileLoaded ? tg.MainButton.show() : tg.MainButton.hide(); }
  $('save').style.display = useMain ? 'none' : '';
  const d = loadDraft();
  $('draft').innerHTML = !fileLoaded && d && d.events && d.events.length
    ? `<div class="drop" id="resume" style="border-style:solid"><b>Продолжить правки</b><span>${h(d.fileName)} · записей: ${d.events.length}</span></div>` : '';
  const list = $('list');
  if (!fileLoaded){ list.innerHTML = ''; $('strip').innerHTML = ''; return; }
  const today = new Date(), tk = `${today.getFullYear()}${p2(today.getMonth()+1)}${p2(today.getDate())}`;
  let vis = visible().sort((a, b) => key(a).localeCompare(key(b)));
  const q = $('q').value.trim(), hasFuture = vis.some(e => key(e).slice(0,8) >= tk);
  let hiddenPast = 0;
  if (!showPast && !q && hasFuture){ const f = vis.filter(e => key(e).slice(0,8) >= tk); hiddenPast = vis.length - f.length; vis = f; }
  if (!vis.length){
    list.innerHTML = n ? '<div class="empty">Ничего не найдено</div>' : '<div class="empty"><div class="ic">🗓</div>Записей пока нет<br>Нажмите «+ Запись»</div>';
    $('strip').innerHTML = ''; return;
  }
  const names = [...new Set(events.map(e => e.summary))].sort();
  const col = s => `hsl(${(names.indexOf(s) * 137.5 + 20) % 360} 48% 52%)`;
  const days = new Map();
  vis.forEach(e => { const k = key(e).slice(0,8); if (!days.has(k)) days.set(k, []); days.get(k).push(e); });
  let html = hiddenPast ? `<button class="past" id="past">Показать прошедшие дни (${hiddenPast})</button>`
    : (showPast && hasFuture && !q ? '<button class="past" id="past">Скрыть прошедшие дни</button>' : '');
  for (const [dk, list2] of days){
    const isT = dk === tk, isC = collapsed.has(dk);
    html += `<div class="day ${isT ? 'today' : ''}" data-day="${dk}" data-tg="1"><span>${dk ? fmtDay(dk) : 'Без даты'}${isT ? ' · сегодня' : ''}</span><span class="cnt">${isC ? '▸' : '▾'} ${list2.length}</span></div>`;
    if (isC) continue;
    for (const e of list2){
      const t1 = hm(e.start), t2 = hm(e.end), time = t1 ? (t2 ? `${t1}–${t2}` : t1) : 'весь день';
      html += `<div class="ev ${bad.has(e.id) ? 'bad' : ''} ${e.cancelled ? 'cx' : ''} ${excluded.has(e.summary) ? 'ex' : ''}" style="--c:${col(e.summary)}">
        ${selMode ? `<input type="checkbox" data-s="${e.id}" ${sel.has(e.id) ? 'checked' : ''}>` : ''}
        <div class="m" data-i="${e.id}"><strong>${h(e.summary || 'Без названия')}</strong>
          <div class="meta"><span class="pill">${time}</span>${e.location ? `<small>${h(e.location)}</small>` : ''}${bad.has(e.id) ? '<span class="w">⚠ пересечение</span>' : ''}</div></div>
        ${selMode ? '' : `<button class="x c" data-cx="${e.id}" aria-label="Отменить пару">⊘</button><button class="x" data-del="${e.id}" aria-label="Удалить">×</button>`}</div>`;
    }
  }
  list.innerHTML = html;
  $('strip').innerHTML = [...days.keys()].filter(Boolean).map(dk => `<button class="chip ${dk === tk ? 't' : ''}" data-go="${dk}"><span>${wd(dk)}</span><b>${+dk.slice(6,8)}</b></button>`).join('');
  if (!scrolled){
    scrolled = true;
    const t = [...list.querySelectorAll('.day')].find(x => x.dataset.day >= tk);
    if (t) setTimeout(() => t.scrollIntoView({ block:'start' }), 0);
  }
}
$('strip').onclick = e => {
  const b = e.target.closest('[data-go]'); if (!b) return;
  const el = $('list').querySelector(`.day[data-day="${b.dataset.go}"]`);
  if (el) el.scrollIntoView({ behavior:'smooth', block:'start' });
};
const p2 = n => String(n).padStart(2,'0');
$('q').oninput = render;

/* ---------- load ---------- */
function setData(evs, oth, name, o, ex){
  excluded = new Set(ex || []); events = evs; others = oth; fileName = name; fileLoaded = true; undoStack = []; sel.clear(); selMode = false; scrolled = false;
  nid = Math.max(nid, ...events.map(e => e.id), 0);
  if (o) orig = o; else snapOrig();
  saveDraft(); render();
}
function load(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    const { evs, oth } = parseICS(String(r.result));
    setData(evs, oth, file.name || 'schedule.ics');
    toast(!evs.length ? 'Записей в файле не найдено' : matchMedia('(hover:none)').matches ? 'Свайп влево — удалить, вправо — отменить пару' : 'Файл загружен');
  };
  r.readAsText(file);
}
$('file').onchange = e => load(e.target.files[0]);
const drop = $('drop');
['dragover','dragenter'].forEach(n => drop.addEventListener(n, e => { e.preventDefault(); }));
drop.addEventListener('drop', e => { e.preventDefault(); load(e.dataTransfer.files[0]); });
$('draft').onclick = e => {
  if (!e.target.closest('#resume')) return;
  const d = loadDraft(); if (d) setData(d.events, d.others, d.fileName, d.orig, d.excluded);
};

/* ---------- editor ---------- */
const lms = s => new Date(s.length === 10 ? s + 'T00:00' : s).getTime();
const lfmt = (ms, all) => {
  const d = new Date(ms), D = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  return all ? D : `${D}T${p2(d.getHours())}:${p2(d.getMinutes())}`;
};
const shiftStr = (v, days) => { if (!v) return v; const d = new Date(lms(v)); d.setDate(d.getDate() + days); return lfmt(d.getTime(), v.length === 10); };
function setType(){ const t = $('fa').checked ? 'date' : 'datetime-local'; $('fb').type = t; $('fe').type = t; }
$('fa').onchange = () => {
  const b = $('fb').value, e = $('fe').value, a = $('fa').checked;
  setType(); $('slots').style.display = a ? 'none' : 'flex';
  $('fb').value = b ? b.slice(0,10) + (a ? '' : 'T09:00') : '';
  $('fe').value = e ? e.slice(0,10) + (a ? '' : 'T10:00') : '';
  prevStart = $('fb').value;
};
$('fb').onchange = () => {   /* сохраняем длительность пары */
  const nv = $('fb').value;
  if (nv && prevStart && $('fe').value){
    const delta = lms(nv) - lms(prevStart);
    $('fe').value = lfmt(lms($('fe').value) + delta, $('fa').checked);
  }
  prevStart = nv;
};
function slotList(){
  const c = new Map();
  events.forEach(e => {
    if (!e.start || isAllDay(e.start) || !e.end || isAllDay(e.end)) return;
    const k = toInput(e.start).slice(11) + '|' + toInput(e.end).slice(11); c.set(k, (c.get(k) || 0) + 1);
  });
  let l = [...c].sort((a, b) => b[1] - a[1]).slice(0, 6).map(x => x[0]).sort();
  return l.length >= 2 ? l : ['08:00|09:40','10:00|11:40','12:00|13:40','14:00|15:40','16:00|17:40'];
}
$('slots').onclick = e => {
  const b = e.target.closest('[data-sl]'); if (!b) return;
  const [x, y] = b.dataset.sl.split('|'), d = ($('fb').value || lfmt(Date.now())).slice(0, 10);
  $('fb').value = d + 'T' + x; $('fe').value = d + 'T' + y; prevStart = $('fb').value;
};
function openEditor(id){
  editing = id;
  const e = id == null ? null : byId(id);
  $('ls').innerHTML = [...new Set(events.map(x => x.summary).filter(Boolean))].map(v => `<option value="${h(v)}">`).join('');
  $('ll').innerHTML = [...new Set(events.map(x => x.location).filter(Boolean))].map(v => `<option value="${h(v)}">`).join('');
  $('fa').checked = e ? isAllDay(e.start) : false;
  $('fc').checked = e ? !!e.cancelled : false;
  $('slots').innerHTML = slotList().map(k => `<button type="button" class="chip" data-sl="${k}">${k.replace('|','–')}</button>`).join('');
  $('slots').style.display = $('fa').checked ? 'none' : 'flex';
  setType();
  $('fs').value = e ? e.summary : ''; $('fl').value = e ? e.location : ''; $('fd').value = e ? e.description : '';
  $('fr').value = 0; $('fcopy').style.display = e ? '' : 'none';
  if (e){ $('fb').value = toInput(e.start); $('fe').value = toInput(e.end); }
  else {
    const n = new Date(); n.setMinutes(0,0,0); n.setHours(n.getHours() + 1);
    $('fb').value = lfmt(n.getTime()); n.setHours(n.getHours() + 1); $('fe').value = lfmt(n.getTime());
  }
  prevStart = $('fb').value;
  openD('dlg');
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
}
$('add').onclick = () => openEditor(null);
$('cancel').onclick = () => $('dlg').close();
$('fcopy').onclick = () => {   /* превращает форму в новую запись: поменяйте дату и сохраните */
  editing = null; $('fcopy').style.display = 'none';
  $('fb').value = shiftStr($('fb').value, 1); if ($('fe').value) $('fe').value = shiftStr($('fe').value, 1);
  prevStart = $('fb').value; toast('Копия: поменяйте день и сохраните');
};
$('f').onsubmit = () => {
  const old = editing == null ? null : byId(editing), all = $('fa').checked;
  const N = Math.max(0, Math.min(40, +$('fr').value || 0));
  const b = $('fb').value, en = $('fe').value;
  const fields = { summary:$('fs').value.trim(), location:$('fl').value.trim(), description:$('fd').value, cancelled:$('fc').checked };
  mutate(() => {
    const ref = old ? old.start : null, refE = old ? old.end : null, extra = old ? old.extra : [];
    if (old) Object.assign(old, fields, { start: fromInput(b, all, ref), end: fromInput(en, all, refE) });
    for (let k = old ? 1 : 0; k <= N; k++)
      events.push(Object.assign({ id: ++nid, uid:'', extra: extra.slice() }, fields,
        { start: fromInput(shiftStr(b, 7*k), all, ref), end: fromInput(shiftStr(en, 7*k), all, refE) }));
    if (!old && N === 0) { /* уже добавлена k=0 */ }
  });
  toast(N ? `Сохранено, добавлено копий: ${N}` : 'Сохранено');
};

/* ---------- list actions ---------- */
function delEvent(id){
  const e = byId(id);
  mutate(() => { events = events.filter(x => x.id !== id); });
  toast(`Удалено: ${e.summary || 'запись'} · Вернуть`, true);
}
function toggleCx(id){
  const e = byId(id);
  mutate(() => { e.cancelled = !e.cancelled; });
  toast(e.cancelled ? 'Пара отменена · Вернуть' : 'Пара возвращена', e.cancelled);
}
let swiped = false;
$('list').onclick = ev => {
  if (swiped) return;
  if (ev.target.closest('#past')){ showPast = !showPast; render(); return; }
  const dh = ev.target.closest('[data-tg]');
  if (dh){ const d = dh.dataset.day; collapsed.has(d) ? collapsed.delete(d) : collapsed.add(d); render(); return; }
  const cx = ev.target.closest('[data-cx]'); if (cx){ toggleCx(+cx.dataset.cx); return; }
  const del = ev.target.closest('[data-del]'); if (del){ delEvent(+del.dataset.del); return; }
  const row = ev.target.closest('.ev') && ev.target.closest('.ev').querySelector('[data-i]');
  if (!row) return;
  const id = +row.dataset.i;
  if (selMode){ sel.has(id) ? sel.delete(id) : sel.add(id); render(); }
  else openEditor(id);
};
/* свайп: влево — удалить, вправо — отменить пару */
let sw = null, sdx = 0;
$('list').addEventListener('touchstart', e => {
  const c = !selMode && e.target.closest('.ev');
  sw = c ? { c, x: e.touches[0].clientX, y: e.touches[0].clientY } : null; sdx = 0;
}, { passive:true });
$('list').addEventListener('touchmove', e => {
  if (!sw) return;
  const t = e.touches[0]; sdx = t.clientX - sw.x;
  if (Math.abs(sdx) < 12 || Math.abs(t.clientY - sw.y) > Math.abs(sdx)) return;
  sw.c.style.transition = 'none';
  sw.c.style.transform = `translateX(${Math.max(-110, Math.min(110, sdx))}px)`;
  sw.c.dataset.sw = sdx < 0 ? 'del' : 'cx';
}, { passive:true });
$('list').addEventListener('touchend', () => {
  if (!sw) return;
  const c = sw.c, m = c.querySelector('[data-i]'); sw = null;
  c.style.transition = ''; c.style.transform = ''; delete c.dataset.sw;
  if (Math.abs(sdx) > 80 && m){
    swiped = true; setTimeout(() => swiped = false, 400);
    const id = +m.dataset.i; sdx < 0 ? delEvent(id) : toggleCx(id);
  }
});
$('selmode').onclick = () => { selMode = !selMode; sel.clear(); render(); };
$('seldone').onclick = () => { selMode = false; sel.clear(); render(); };
$('selall').onclick = () => { visible().forEach(e => sel.add(e.id)); render(); };
$('seldel').onclick = () => {
  if (!confirm(`Удалить выбранные записи: ${sel.size}?`)) return;
  const n = sel.size;
  mutate(() => { events = events.filter(e => !sel.has(e.id)); sel.clear(); selMode = false; });
  toast(`Удалено: ${n} · Отменить`, true);
};

/* ---------- export ---------- */
function fold(line){
  const out = []; let s = line;
  while (s.length > 74){ out.push(s.slice(0,74)); s = ' ' + s.slice(74); }
  out.push(s); return out;
}
function buildICS(){
  const L = ['BEGIN:VCALENDAR'];
  const has = n => others.some(l => l.toUpperCase().startsWith(n));
  if (!has('VERSION')) L.push('VERSION:2.0');
  if (!has('PRODID')) L.push('PRODID:-//Telegram ICS Editor//RU');
  L.push(...others);
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  for (const e of exported()){
    L.push('BEGIN:VEVENT');
    L.push('UID:' + (e.uid || (crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random()) + '@ics-editor'));
    if (!e.extra.some(l => /^DTSTAMP/i.test(l))) L.push('DTSTAMP:' + stamp);
    if (e.start) L.push(`DTSTART${e.start.params}:${e.start.v}`);
    if (e.end) L.push(`DTEND${e.end.params}:${e.end.v}`);
    L.push('SUMMARY:' + esc((e.cancelled ? '[Отмена] ' : '') + e.summary));
    if (e.location) L.push('LOCATION:' + esc(e.location));
    if (e.description) L.push('DESCRIPTION:' + esc(e.description));
    L.push(...(e.cancelled ? e.extra.filter(l => !/^STATUS/i.test(l)) : e.extra));
    if (e.cancelled) L.push('STATUS:CANCELLED');
    L.push('END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return L.flatMap(fold).join('\r\n') + '\r\n';
}
const outName = () => fileName.replace(/\.ics$/i,'').replace(/-edited$/,'') + '-edited.ics';
async function shareFile(){
  const text = buildICS();
  for (const type of ['text/calendar','text/plain']){
    const file = new File([text], outName(), { type });
    if (navigator.canShare && navigator.canShare({ files:[file] })){
      try { await navigator.share({ files:[file], title: file.name }); return true; }
      catch(e){ if (e.name === 'AbortError') return true; }
    }
  }
  return false;
}
async function doExport(){
  try { tg.disableClosingConfirmation(); } catch(e){}
  if (await shareFile()) return;
  if (/iPhone|iPad|iPod/.test(navigator.userAgent)){ showText(); return; }
  const url = URL.createObjectURL(new Blob([buildICS()], { type:'text/calendar;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = outName();
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function exported(){ return events.filter(e => !excluded.has(e.summary)); }
function diffHTML(){
  const ex = exported(), cur = new Map(ex.map(e => [okey(e), e])), add = [], chg = [], del = [];
  cur.forEach((e, k) => { if (!orig[k]) add.push(e); else if (orig[k].s !== sig(e)) chg.push(e); });
  const hid = new Set(events.filter(e => excluded.has(e.summary)).map(okey));
  Object.keys(orig).forEach(k => { if (!cur.has(k) && !hid.has(k)) del.push(orig[k].name); });
  const ul = (t, a, c) => a.length ? `<p style="margin:6px 0 2px;color:${c}"><b>${t}: ${a.length}</b></p><ul class="dl">${a.map(x => `<li>${h(x)}</li>`).join('')}</ul>` : '';
  const hidden = events.length - ex.length;
  const note = hidden ? `<p class="sub">Не войдёт в файл: ${hidden} (предметов: ${excluded.size})</p>` : '';
  const total = add.length + chg.length + del.length;
  return (total || hidden) ? note + ul('Добавлено', add.map(lbl), '#2e9d58') + ul('Изменено', chg.map(lbl), 'var(--ac)') + ul('Удалено', del, 'var(--red)') : '';
}
/* ---------- subjects filter ---------- */
function renderSubj(){
  const m = new Map(); events.forEach(e => m.set(e.summary, (m.get(e.summary) || 0) + 1));
  $('sl').innerHTML = [...m].sort((a, b) => a[0].localeCompare(b[0])).map(([n, c]) =>
    `<label class="chk"><input type="checkbox" data-n="${h(n)}" ${excluded.has(n) ? '' : 'checked'}><span style="flex:1;word-break:break-word">${h(n || 'Без названия')}</span><span style="color:var(--hint)">${c}</span></label>`).join('');
}
$('subj').onclick = () => { renderSubj(); openD('sd'); };
$('sl').onchange = e => { const n = e.target.dataset.n; e.target.checked ? excluded.delete(n) : excluded.add(n); saveDraft(); render(); };
$('sall').onclick = () => { excluded.clear(); renderSubj(); saveDraft(); render(); };
$('snone').onclick = () => { events.forEach(e => excluded.add(e.summary)); renderSubj(); saveDraft(); render(); };
$('sdone').onclick = () => $('sd').close();
$('save').onclick = () => {
  const d = diffHTML();
  if (!d){ doExport(); return; }
  $('ddb').innerHTML = d; openD('dd');
};
$('ddc').onclick = () => $('dd').close();
$('ddok').onclick = () => { $('dd').close(); doExport(); };
function showText(){ $('txa').value = buildICS(); openD('txd'); }
$('share').onclick = showText;
$('txc').onclick = async () => {
  try { await navigator.clipboard.writeText($('txa').value); } catch(e){ $('txa').select(); document.execCommand('copy'); }
  toast('Скопировано');
};

function toast(t, act){
  const el = $('toast'); el.textContent = t; el.classList.add('on'); el.classList.toggle('act', !!act);
  el.onclick = act ? () => { undo(); el.classList.remove('on'); } : null;
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), act ? 5000 : 2500);
}
function buzz(){ try { tg.HapticFeedback.impactOccurred('light'); } catch(e){} }
function openD(id){ $(id).showModal(); try { tg.BackButton.show(); } catch(e){} }
document.querySelectorAll('dialog').forEach(d => d.addEventListener('close', () => {
  if (!document.querySelector('dialog[open]')) { try { tg.BackButton.hide(); } catch(e){} }
}));
try { tg.BackButton.onClick(() => document.querySelectorAll('dialog[open]').forEach(d => d.close())); } catch(e){}
let useMain = false;
if (tg && tg.MainButton && tg.MainButton.setText){
  useMain = true; tg.MainButton.setText('Сохранить .ics'); tg.MainButton.onClick(() => $('save').click());
}
render();
</script>
